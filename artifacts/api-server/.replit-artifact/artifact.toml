kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pip", "install", "-r", "telegram-bot/requirements.txt"]

[services.production.run]
args = ["python", "telegram-bot/bot.py"]

[services.production.run.env]
NODE_ENV = "production"
